<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>ระบบรับสิทธิพิเศษ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <script src="config.js?v=1000"></script>
</head>
<body style="background-color: #f5f5f5; text-align: center; font-family: sans-serif; padding-top: 30px; margin: 0;">
  
  <div id="loadingSection" style="padding: 20px;">
    <h3 id="statusText" style="color: #666;">กำลังดึงข้อมูลระบบ...</h3>
  </div>

  <div id="shareSection" style="display: none; padding: 20px;">
    <h2 style="color: #D4AF37; margin-bottom: 10px;">Premium Member</h2>
    <p style="color: #666; margin-bottom: 25px; font-size: 14px;">
      ส่งต่อสิทธิประโยชน์ที่คุ้มค่ากว่าและการดูแลที่เหนือกว่าให้เพื่อนของคุณ
    </p>
    <button id="btnShare" onclick="executeShare()" style="background-color: #1DB446; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; max-width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
      เลือกเพื่อนเพื่อแชร์สิทธิ์
    </button>
  </div>

  <script>
    let gasAppUrl = "", liffId = "", lineOALink = "", formLiffUrl = "";
    let currentUserId = "", currentUserName = "", currentUserPic = "";

    window.onload = async function() {
      const statusText = document.getElementById('statusText');
      
      try {
        if (typeof APP_CONFIG === 'undefined') {
          throw new Error("หาไฟล์ config.js ไม่เจอ หรือมีพิมพ์โค้ดผิดในไฟล์ config.js ครับ");
        }
        
        statusText.innerText = "กำลังตรวจสอบข้อมูล...";
        
        gasAppUrl = APP_CONFIG.GAS_API_URL || ""; 
        lineOALink = (APP_CONFIG.URL_FRIEND || APP_CONFIG.LINE_OA_LINK || "").trim();
        formLiffUrl = (APP_CONFIG.URL_FORM || APP_CONFIG.FORM_LIFF_URL || "").trim();

        let rawLiff = APP_CONFIG.LIFF_MAIN || APP_CONFIG.MAIN_LIFF_ID || "";
        let matchId = String(rawLiff).match(/\d{10}-[a-zA-Z0-9]{8}/);
        liffId = matchId ? matchId[0] : "";

        if (!liffId) throw new Error("LIFF_MAIN ในไฟล์ config.js ผิดรูปแบบครับ");
        
        await liff.init({ liffId: liffId });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const profile = await liff.getProfile();
        currentUserId = profile.userId || "";
        currentUserName = profile.displayName || "สมาชิก";
        currentUserPic = profile.pictureUrl || "";

        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('refId');
        
        if (refId) {
          statusText.innerText = "กำลังตรวจสอบสิทธิ์...";
          const friendship = await liff.getFriendship();
          
          if (!friendship.friendFlag) {
            statusText.innerHTML = "คุณต้องเพิ่มเพื่อนก่อนเพื่อรับสิทธิ์<br>กำลังพาคุณไปยังหน้าเพิ่มเพื่อน...";
            setTimeout(() => { window.location.href = lineOALink; }, 2500);
            return; 
          }

          statusText.innerText = "ยืนยันการรับสิทธิ์ให้คุณ " + currentUserName + "...";
          
          const url = new URL(gasAppUrl);
          url.searchParams.append("action", "recordReferral");
          url.searchParams.append("refId", refId);
          url.searchParams.append("refName", urlParams.get('refName') || "");
          url.searchParams.append("refPic", urlParams.get('refPic') || "");
          url.searchParams.append("newUserId", currentUserId);
          url.searchParams.append("newUserName", currentUserName);
          url.searchParams.append("newUserPic", currentUserPic);

          fetch(url)
            .then(response => response.json())
            .then(result => {
              if (result.status === "duplicate") {
                document.getElementById('loadingSection').innerHTML = `
                  <h2 style="color: #FF9800; margin-bottom: 10px; font-size: 24px;">คุณเคยรับสิทธิ์นี้ไปแล้ว!</h2>
                  <p style="color: #666; margin-bottom: 25px; font-size: 16px;">คุณสามารถตรวจสอบสิทธิพิเศษของคุณได้ที่หน้าแชทครับ</p>
                  <button onclick="liff.closeWindow()" style="background-color: #1e3a8a; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; max-width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">💬 กลับสู่หน้าแชท</button>
                `;
              } else if (result.status === "success") {
                // 🟢 ลบปุ่มออก และแสดงข้อความกำลังพาไปหน้าถัดไป
                document.getElementById('loadingSection').innerHTML = `
                  <h2 style="color: #1DB446; margin-bottom: 10px; font-size: 24px;">ยืนยันรับสิทธิ์สำเร็จ!</h2>
                  <p style="color: #666; margin-bottom: 25px; font-size: 16px;">กำลังพาคุณเข้าสู่หน้าแบบสอบถาม...</p>
                `;
                
                // 🟢 หน่วงเวลา 1.5 วินาทีให้ลูกค้าอ่านทัน แล้วส่งทะลุเข้าหน้าฟอร์มทันที
                setTimeout(() => {
                  goToSurvey();
                }, 1500);
                
              } else {
                statusText.innerHTML = `<span style="color:red;">Error: ${result.message}</span>`;
              }
            })
            .catch(err => {
              statusText.innerHTML = `<span style="color:red;">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: ${err}</span>`;
            });

        } else {
          document.getElementById('loadingSection').style.display = 'none';
          document.getElementById('shareSection').style.display = 'block';
        }
      } catch (error) {
        statusText.innerHTML = `<span style="color:red; font-size: 14px;"><b>ระบบขัดข้อง:</b><br>${error.message}</span>`;
      }
    };

    function goToSurvey() {
      if(liff.isApiAvailable('openWindow')) {
        liff.openWindow({ url: formLiffUrl, external: false });
        setTimeout(() => liff.closeWindow(), 500); 
      } else {
        window.location.replace(formLiffUrl);
      }
    }

    async function executeShare() {
      if (!liff.isApiAvailable('shareTargetPicker')) return alert("แอป LINE ไม่รองรับ");
      try {
        const trackingLink = "https://liff.line.me/" + liffId + "?refId=" + encodeURIComponent(currentUserId) + "&refName=" + encodeURIComponent(currentUserName) + "&refPic=" + encodeURIComponent(currentUserPic);
        
        await liff.shareTargetPicker([{
          "type": "flex",
          "altText": currentUserName + " ส่งของขวัญสิทธิพิเศษให้คุณ 🎁",
          "contents": {
            "type": "bubble",
            "hero": {
              "type": "image",
              "url": "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
              "size": "full",
              "aspectRatio": "20:13",
              "aspectMode": "cover"
            },
            "body": {
              "type": "box", "layout": "vertical", "contents": [
                { "type": "text", "text": "🎁 EXCLUSIVE VOUCHER", "weight": "bold", "color": "#D4AF37", "size": "sm" },
                { "type": "text", "text": "รับฟรี 50 พอยท์!", "weight": "bold", "size": "xxl", "margin": "md", "color": "#1e3a8a" },
                { "type": "text", "text": "นำไปแลกรับสิทธิพิเศษจากแบรนด์ชั้นนำ เช่น Starbucks, Suki Teenoi, Dairy Queen, MK และอีกมากมาย", "size": "xs", "color": "#666666", "wrap": true, "margin": "md" },
                { "type": "separator", "margin": "lg" },
                {
                  "type": "box", "layout": "vertical", "margin": "lg", "spacing": "sm", "contents": [
                    { "type": "box", "layout": "baseline", "spacing": "sm", "contents": [
                        { "type": "text", "text": "ผู้มอบสิทธิ์", "color": "#aaaaaa", "size": "sm", "flex": 2 },
                        { "type": "text", "text": currentUserName, "wrap": true, "color": "#1DB446", "size": "sm", "flex": 5, "weight": "bold" }
                      ]
                    }
                  ]
                }
              ]
            },
            "footer": {
              "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                { "type": "button", "style": "primary", "height": "sm", "color": "#1DB446", "action": { "type": "uri", "label": "👇 คลิกรับสิทธิ์ด่วน", "uri": trackingLink } }
              ], "flex": 0
            }
          }
        }], { isMultiple: true });
        liff.closeWindow();
      } catch (err) { alert("Error: " + err.message); }
    }
  </script>
</body>
</html>
