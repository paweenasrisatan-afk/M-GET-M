<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรับสิทธิพิเศษ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="background-color: #f5f5f5; text-align: center; font-family: sans-serif; padding-top: 30px; margin: 0;">
  
  <div id="loadingSection" style="padding: 20px;">
    <h3 id="statusText" style="color: #666;">กำลังดึงข้อมูลระบบ...</h3>
  </div>

  <div id="shareSection" style="display: none; padding: 20px;">
    <h2 style="color: #D4AF37; margin-bottom: 10px;">Premium Member</h2>
    <p style="color: #666; margin-bottom: 25px; font-size: 14px;">
      ส่งต่อสิทธิประโยชน์ที่คุ้มค่ากว่าและการดูแลที่เหนือกว่าให้เพื่อนของคุณ
    </p>
    <button id="btnShare" onclick="executeShare()" style="background-color: #1DB446; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; max-width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
      เลือกเพื่อนเพื่อแชร์สิทธิ์
    </button>
  </div>

  <script>
    // ⚠️ ใส่ลิงก์ GAS ตรงนี้ 
    const gasAppUrl = "https://script.google.com/macros/s/AKfycbw2K9DLTTWTAYkPR5v23ZHkCSNISqiF_gkvVnzHZJJCA-_YnNUKoySCTSwnQeLAvmOENw/exec"; 

    // ตัวแปรที่จะถูกดึงมาจากแท็บ Settings
    let liffId = "";
    let lineOALink = "";
    let formLiffUrl = ""; // 🟢 เพิ่มตัวแปรสำหรับเก็บลิงก์แบบสอบถาม

    let currentUserId = "", currentUserName = "", currentUserPic = "";

    // 🟢 1. ฟังก์ชันดึงค่าจาก Settings ก่อนเริ่มทำงาน
    async function loadConfigAndStart() {
      try {
        const response = await fetch(gasAppUrl + "?timestamp=" + new Date().getTime(), {
          method: 'POST',
          body: JSON.stringify({ action: "getConfig" })
        });
        const result = await response.json();
        
        if (result.success && result.data) {
          liffId = result.data.MAIN_LIFF_ID; 
          lineOALink = result.data.LINE_OA_LINK;
          formLiffUrl = result.data.FORM_LIFF_URL; // 🟢 ดึงลิงก์แบบสอบถามมารอไว้
          
          initializeLiff();
        } else {
          document.getElementById('statusText').innerText = "ดึงข้อมูลล้มเหลว กรุณาลองใหม่";
        }
      } catch (error) {
        document.getElementById('statusText').innerText = "โหลด Config Error: " + error.message;
      }
    }

    // 🟢 2. ฟังก์ชันเริ่มทำงาน LIFF
    async function initializeLiff() {
      const statusText = document.getElementById('statusText');
      statusText.innerText = "กำลังตรวจสอบข้อมูล...";
      
      try {
        if (!liffId) throw new Error("ไม่พบ LIFF ID ในระบบ");
        
        await liff.init({ liffId: liffId });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const profile = await liff.getProfile();
        currentUserId = profile.userId || "";
        currentUserName = profile.displayName || "สมาชิก";
        currentUserPic = profile.pictureUrl || "";

        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('refId');
        
        if (refId) {
          statusText.innerText = "กำลังตรวจสอบสิทธิ์...";
          const friendship = await liff.getFriendship();
          
          if (!friendship.friendFlag) {
            statusText.innerHTML = "คุณต้องเพิ่มเพื่อนก่อนเพื่อรับสิทธิ์<br>กำลังพาคุณไปยังหน้าเพิ่มเพื่อน...";
            setTimeout(() => {
              window.location.href = lineOALink;
            }, 2500);
            return; 
          }

          statusText.innerText = "ยืนยันการรับสิทธิ์ให้คุณ " + currentUserName + "...";
          
          const url = new URL(gasAppUrl);
          url.searchParams.append("action", "recordReferral");
          url.searchParams.append("refId", refId);
          url.searchParams.append("refName", urlParams.get('refName') || "");
          url.searchParams.append("refPic", urlParams.get('refPic') || "");
          url.searchParams.append("newUserId", currentUserId);
          url.searchParams.append("newUserName", currentUserName);
          url.searchParams.append("newUserPic", currentUserPic);

          fetch(url)
            .then(response => response.json())
            .then(result => {
              // 🟢 แก้ไขตรงนี้: ไม่สั่งปิดหน้าจอ แต่สั่งให้กระโดดไปหน้าแบบสอบถามแทน!
              if (result.status === "duplicate") {
                statusText.innerText = "คุณเคยรับสิทธิ์นี้ไปแล้ว\nกำลังพากลับไปหน้าแบบสอบถาม...";
                setTimeout(() => { 
                  window.location.href = formLiffUrl; // เด้งไปหน้าฟอร์ม
                }, 2000); 
              } else if (result.status === "success") {
                statusText.innerText = "ยืนยันสำเร็จ!\nกำลังพาเข้าสู่หน้าแบบสอบถาม...";
                setTimeout(() => { 
                  window.location.href = formLiffUrl; // เด้งไปหน้าฟอร์ม
                }, 1500);
              } else {
                statusText.innerText = "Error: " + result.message;
              }
            })
            .catch(err => {
              statusText.innerText = "Error: " + err;
            });

        } else {
          document.getElementById('loadingSection').style.display = 'none';
          document.getElementById('shareSection').style.display = 'block';
        }
      } catch (error) {
        statusText.innerText = "LIFF Error: " + error.message;
      }
    }

    async function executeShare() {
      if (!liff.isApiAvailable('shareTargetPicker')) return alert("แอป LINE ไม่รองรับ");
      try {
        const trackingLink = "https://liff.line.me/" + liffId + "?refId=" + encodeURIComponent(currentUserId) + "&refName=" + encodeURIComponent(currentUserName) + "&refPic=" + encodeURIComponent(currentUserPic);
        
        await liff.shareTargetPicker([{
          "type": "flex",
          "altText": currentUserName + " มอบสิทธิพิเศษให้คุณ",
          "contents": {
            "type": "bubble",
            "body": {
              "type": "box", "layout": "vertical",
              "contents": [
                { "type": "text", "text": "Exclusive Privilege", "weight": "bold", "color": "#D4AF37", "size": "sm" },
                { "type": "text", "text": "สิทธิประโยชน์ที่คุ้มค่ากว่า", "weight": "bold", "size": "xl", "margin": "md" },
                { "type": "text", "text": "เพื่อนของคุณ (" + currentUserName + ") มอบคูปองพิเศษสำหรับคุณโดยเฉพาะ", "wrap": true, "margin": "md", "color": "#666666" }
              ]
            },
            "footer": {
              "type": "box", "layout": "vertical",
              "contents": [{
                "type": "button", "style": "primary", "color": "#1DB446",
                "action": { "type": "uri", "label": "กดรับสิทธิ์ทันที", "uri": trackingLink }
              }]
            }
          }
        }], { isMultiple: true });
        liff.closeWindow();
      } catch (err) { alert("Error: " + err.message); }
    }

    window.onload = loadConfigAndStart;
  </script>
</body>
</html>
