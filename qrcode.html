<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code สิทธิพิเศษของคุณ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { background-color: #f5f5f5; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
    .card { background: white; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 350px; margin: 20px auto; }
    img { max-width: 100%; border-radius: 8px; margin-top: 15px; border: 2px solid #f0f0f0; }
    h2 { color: #D4AF37; margin-bottom: 5px; font-size: 22px; }
    p { color: #666; font-size: 14px; margin-bottom: 15px; line-height: 1.5; }
    .btn { background-color: #1DB446; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  
  <div id="loading" style="margin-top: 50px; color: #666;">กำลังสร้าง QR Code ส่วนตัวของคุณ...</div>
  
  <div class="card" id="qrContainer" style="display: none;">
    <h2>Exclusive QR Code</h2>
    <p>ให้เพื่อนสแกน QR Code นี้ หรือแคปหน้าจอส่งให้เพื่อน เพื่อมอบสิทธิ์การดูแลที่เหนือกว่า และรับ +100 พอยท์ เมื่อเพื่อนรับสิทธิ์สำเร็จ</p>
    
    <!-- ตรงนี้คือจุดที่รูป QR Code จะมาแสดง -->
    <img id="qrImage" src="" alt="QR Code ของคุณ">
    
    <button class="btn" onclick="liff.closeWindow()">ปิดหน้าต่างนี้</button>
  </div>

  <script>
    // ⚠️ 1. ใส่ LIFF ID ของแคมเปญหลัก (ตัวที่ใช้กดลิงก์แชร์)
    const mainLiffId = "2010894828-FWOl6zme"; 
    
    // ⚠️ 2. ใส่ LIFF ID ตัวใหม่ที่คุณเพิ่งสร้างในขั้นตอนที่ 1
    const qrLiffId = "2010894828-9WloHvv9"; 
    
    async function init() {
      try {
        await liff.init({ liffId: qrLiffId }); 
        if (!liff.isLoggedIn()) { liff.login(); return; }

        // ดึงข้อมูลลูกค้าเพื่อนำไปฝังในลิงก์ Tracking
        const profile = await liff.getProfile();
        
        // สร้างลิงก์แชร์แบบเดียวกับปุ่มส่งคอนแทค
        const trackingLink = "https://liff.line.me/" + mainLiffId + 
                             "?refId=" + encodeURIComponent(profile.userId) + 
                             "&refName=" + encodeURIComponent(profile.displayName) + 
                             "&refPic=" + encodeURIComponent(profile.pictureUrl || "");
        
        // ใช้ API แปลงลิงก์เป็นรูปภาพ QR Code
        const qrUrl = "https://quickchart.io/qr?size=500&margin=2&text=" + encodeURIComponent(trackingLink);
        
        // นำรูปลงไปแสดงบนหน้าเว็บ
        document.getElementById('qrImage').src = qrUrl;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('qrContainer').style.display = 'block';

      } catch (err) {
        document.getElementById('loading').innerText = "Error: " + err.message;
      }
    }
    
    init();
  </script>
</body>
</html>
