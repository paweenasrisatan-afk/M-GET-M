<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code สิทธิพิเศษของคุณ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { background-color: #f5f5f5; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
    .card { background: white; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 350px; margin: 20px auto; }
    img { max-width: 100%; border-radius: 8px; margin-top: 15px; border: 2px solid #f0f0f0; }
    h2 { color: #D4AF37; margin-bottom: 5px; font-size: 22px; }
    p { color: #666; font-size: 14px; margin-bottom: 15px; line-height: 1.5; }
    .btn { background-color: #1DB446; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  
  <div id="loading" style="margin-top: 50px; color: #666;">กำลังดึงข้อมูลระบบ...</div>
  
  <div class="card" id="qrContainer" style="display: none;">
    <h2>Exclusive QR Code</h2>
    <p>ให้เพื่อนสแกน QR Code นี้ หรือแคปหน้าจอส่งให้เพื่อน เพื่อมอบสิทธิ์การดูแลที่เหนือกว่า และรับ +100 พอยท์ เมื่อเพื่อนรับสิทธิ์สำเร็จ</p>
    
    <!-- ตรงนี้คือจุดที่รูป QR Code จะมาแสดง -->
    <img id="qrImage" src="" alt="QR Code ของคุณ">
    
    <button class="btn" onclick="liff.closeWindow()">ปิดหน้าต่างนี้</button>
  </div>

  <script>
    // ⚠️ ใส่ลิงก์ GAS ตรงนี้ เพื่อให้ระบบใช้เป็นกุญแจวิ่งไปดึงค่าตัวแปรอื่นๆ จากชีต Settings
    const gasAppUrl = "https://script.google.com/macros/s/AKfycbw2K9DLTTWTAYkPR5v23ZHkCSNISqiF_gkvVnzHZJJCA-_YnNUKoySCTSwnQeLAvmOENw/exec"; 

    // ตัวแปรที่จะถูกดึงมาจากแท็บ Settings อัตโนมัติ
    let mainLiffId = ""; 
    let qrLiffId = ""; 
    
    // 🟢 1. ฟังก์ชันดึงค่าจาก Settings ก่อนเริ่มทำงาน
    async function loadConfigAndStart() {
      try {
        const response = await fetch(gasAppUrl + "?timestamp=" + new Date().getTime(), {
          method: 'POST',
          body: JSON.stringify({ action: "getConfig" })
        });
        const result = await response.json();
        
        if (result.success && result.data) {
          // ดึงค่าจากชีตมาใส่ในตัวแปร
          mainLiffId = result.data.MAIN_LIFF_ID; 
          qrLiffId = result.data.QR_LIFF_ID;
          
          // เมื่อได้ค่าครบแล้ว ค่อยให้เริ่มสร้าง QR Code
          initQR();
        } else {
          document.getElementById('loading').innerText = "ดึงข้อมูลล้มเหลว กรุณาลองใหม่";
        }
      } catch (error) {
        document.getElementById('loading').innerText = "โหลด Config Error: " + error.message;
      }
    }

    // 🟢 2. ฟังก์ชันเริ่มทำงาน LIFF และสร้างรูป QR Code
    async function initQR() {
      document.getElementById('loading').innerText = "กำลังสร้าง QR Code ส่วนตัวของคุณ...";
      try {
        if (!qrLiffId) throw new Error("ไม่พบ QR_LIFF_ID ในแท็บ Settings");

        await liff.init({ liffId: qrLiffId }); 
        if (!liff.isLoggedIn()) { liff.login(); return; }

        // ดึงข้อมูลลูกค้าเพื่อนำไปฝังในลิงก์ Tracking
        const profile = await liff.getProfile();
        
        // สร้างลิงก์แชร์โดยดึง MAIN_LIFF_ID มาใช้เป็นตัวรับค่า
        const trackingLink = "https://liff.line.me/" + mainLiffId + 
                             "?refId=" + encodeURIComponent(profile.userId) + 
                             "&refName=" + encodeURIComponent(profile.displayName) + 
                             "&refPic=" + encodeURIComponent(profile.pictureUrl || "");
        
        // ใช้ API แปลงลิงก์เป็นรูปภาพ QR Code
        const qrUrl = "https://quickchart.io/qr?size=500&margin=2&text=" + encodeURIComponent(trackingLink);
        
        // นำรูปลงไปแสดงบนหน้าเว็บ
        document.getElementById('qrImage').src = qrUrl;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('qrContainer').style.display = 'block';

      } catch (err) {
        document.getElementById('loading').innerText = "LIFF Error: " + err.message;
      }
    }
    
    // สั่งให้ดึง Config ตอนโหลดหน้าเว็บ
    window.onload = loadConfigAndStart;
  </script>
</body>
</html>
